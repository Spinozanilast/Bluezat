name: Publish
on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish:
    permissions:
      contents: read
      packages: write
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x

      - name: Dotnet pack
        run: |
          dotnet pack -c Release --output ./artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for nupkg in artifacts/*.nupkg; do
            [ -f "$nupkg" ] || continue
            dotnet nuget push "$nupkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for nupkg in artifacts/*.nupkg; do
            [ -f "$nupkg" ] || continue
            dotnet nuget push "$nupkg" \
              --source "https://nuget.pkg.github.com/Spinozanilast/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done